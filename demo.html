<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofread - demo</title>
<style>
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --fg: #18181b;
    --muted: #71717a;
    --line: #e4e4e7;
    --accent: #1d4ed8;
    --them: #f1f3f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 32px 16px;
    background: radial-gradient(120% 120% at 50% 0%, #f8fafc 0%, var(--bg) 60%);
    color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .chat {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    height: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(15, 23, 42, .12);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #6366f1, #1d4ed8);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
  }
  .who { font-weight: 600; }
  .status { font-size: 12px; color: var(--muted); }
  .status::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 5px;
    border-radius: 999px;
    background: #22c55e;
  }

  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  /* solo los mensajes nuevos animan; los iniciales quedan fijos */
  .msg.nuevo { animation: pop .16s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .msg.them {
    align-self: flex-start;
    background: var(--them);
    border-bottom-left-radius: 5px;
  }
  .msg.me {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 5px;
  }
  .time {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    opacity: .6;
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1;
    resize: none;
    min-height: 42px;
    max-height: 120px;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: inherit;
    font: inherit;
  }
  textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 1px; }
  button {
    height: 42px;
    padding: 0 18px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: not-allowed; filter: none; }

  .hint {
    max-width: 520px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  .hint code {
    padding: 1px 5px;
    border-radius: 5px;
    background: #fff;
    border: 1px solid var(--line);
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="chat">
  <header>
    <div class="avatar">MP</div>
    <div>
      <div class="who">Martina Paz</div>
      <div class="status">en línea</div>
    </div>
  </header>

  <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversación">
    <div class="msg them">Hola! Estoy teniendo un problema con la pagina, no me carga!<span class="time">10:42</span></div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Escribí tu respuesta…" aria-label="Escribí tu mensaje"></textarea>
    <button type="submit" id="send">Enviar</button>
  </form>
</div>

<script>
  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const form = document.getElementById('form');
  const send = document.getElementById('send');

  const hora = () => new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

  function agregar(texto) {
    const msg = document.createElement('div');
    msg.className = 'msg me nuevo';
    msg.textContent = texto;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = hora();
    msg.appendChild(time);
    thread.appendChild(msg);
    thread.scrollTop = thread.scrollHeight;
  }

  function enviar() {
    const texto = input.value.trim();
    if (!texto) return;
    agregar(texto);
    input.value = '';
    input.style.height = 'auto';
    input.focus();
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); enviar(); });

  // Enter envía, Shift+Enter hace un salto de línea.
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
  });

  // El textarea crece con el texto.
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    send.disabled = !input.value.trim();
  });

  send.disabled = true;
  input.focus();
</script>

</body>
</html>
